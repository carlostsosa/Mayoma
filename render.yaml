services:
  - type: web
    name: catalogo
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn catalogo.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: catalogo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: catalogo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: catalogo-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: catalogo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: catalogo-db
          property: port

databases:
  - name: catalogo-db
    plan: free
    databaseName: catalogo_db
    user: catalogo_user
